upstream demo_app {
    server demo-app:8080;
}

# HTTP redirect to HTTPS
server {
    listen 80;
    server_name localhost;
    # Proxy plain HTTP to the app (do not redirect because host HTTPS port is dynamic)
    location / {
        proxy_pass http://demo_app/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header X-Forwarded-Port $server_port;
    }
}

# HTTPS Server with app proxy
server {
    listen 443 ssl;
    server_name localhost;

    ssl_certificate /etc/ssl/certs/cert.pem;
    ssl_certificate_key /etc/ssl/private/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Main app proxy
    location / {
        proxy_pass http://demo_app/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    # Metrics endpoint (internal access)
    location /metrics {
        proxy_pass http://demo_app/metrics;
        proxy_set_header Host $host;
    }

    # Health check endpoint for sidecar
    location /sidecar/health {
        return 200 "OK";
        add_header Content-Type text/plain;
    }

    # Access logs
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;
}
