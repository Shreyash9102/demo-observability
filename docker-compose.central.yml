version: '3.8'

networks:
  observability:
    external: true

services:
  loki:
    image: grafana/loki:2.8.2
    container_name: loki
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./central/loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
      - loki-wal:/wal
    ports:
      - 3100:3100
    networks:
      - observability
    entrypoint: sh -c "mkdir -p /loki/index /loki/chunks && /usr/bin/loki -config.file=/etc/loki/local-config.yaml"

  tempo:
    image: grafana/tempo:2.3.1
    container_name: tempo
    command: -config.file=/etc/tempo/local-config.yaml
    volumes:
      - ./central/tempo-config.yaml:/etc/tempo/local-config.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - 3200:3200
      - 4317:4317
    networks:
      - observability

  grafana:
    image: grafana/grafana:9.5.2
    container_name: grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
    ports:
      - 3000:3000
    networks:
      - observability

  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: prometheus
    volumes:
      - ./central/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    ports:
      - 9090:9090
    networks:
      - observability

volumes:
  loki-data:
  loki-wal:
  tempo-data:
  prometheus-data:
