[SERVICE]
    Flush        5
    Daemon       Off
    Log_Level    info
    Parsers_File parsers.conf

[INPUT]
    Name tail
    Path /var/log/app.log
    Parser json
    Tag demo-app
    DB /tmp/demo-app-pos.db

[FILTER]
    Name       parser
    Match      *
    Key_Name   message
    Parser     json

[OUTPUT]
    Name loki
    Match demo-app
    Host loki
    Port 3100
    Labels job=demo-app,env=local
